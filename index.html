<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#070b14" />
    <meta name="description" content="WAE OS Enterprise — Sistema operativo empresarial de 22 departamentos." />
    <title>WAE OS Enterprise</title>
    <style>
      html,body,#root{min-height:100%;margin:0;background:#060913;color:#eef2ff;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
      .wae-boot{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 50% 0%,rgba(124,58,237,.18),transparent 36%),#060913}
      .wae-boot-card{width:min(460px,92vw);padding:28px;border:1px solid rgba(148,163,184,.15);border-radius:18px;background:#0d1220;text-align:center;box-shadow:0 25px 80px rgba(0,0,0,.35)}
      .wae-boot-mark{width:52px;height:52px;margin:0 auto 16px;border-radius:15px;display:grid;place-items:center;background:linear-gradient(135deg,#2563eb,#7c3aed);font-weight:900;box-shadow:0 0 35px rgba(124,58,237,.3)}
      .wae-boot h1{font-size:20px;margin:0 0 7px}.wae-boot p{font-size:12px;line-height:1.6;color:#8d97aa;margin:0}.wae-boot-status{margin-top:18px;font-size:10px;color:#34d399;letter-spacing:.08em;text-transform:uppercase}
    </style>
  </head>
  <body>
    <div id="root">
      <div class="wae-boot" id="wae-boot">
        <div class="wae-boot-card">
          <div class="wae-boot-mark">W</div>
          <h1>WAE OS Enterprise</h1>
          <p>Sistema operativo empresarial · 22 departamentos coordinados por inteligencia artificial.</p>
          <div class="wae-boot-status">Iniciando plataforma…</div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
