name: WAE OS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck with diagnostics
        shell: bash
        run: |
          set +e
          npm run typecheck 2>&1 | tee /tmp/typecheck.log
          CODE=${PIPESTATUS[0]}
          if [ "$CODE" -ne 0 ]; then
            cp /tmp/typecheck.log docs/TYPECHECK_DIAGNOSTICS.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/TYPECHECK_DIAGNOSTICS.txt
            git commit -m "ci: capture TypeScript diagnostics" || true
            git push || true
            exit "$CODE"
          fi

      - name: Production build
        run: npm run build
